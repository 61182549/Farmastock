<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - FarmaStock</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <aside th:replace="~{fragments/menu :: menu('productos')}"></aside>

    <main class="contenido">
        <div class="barra">
            <div>
                <h1>Productos</h1>
                <p class="subtitulo">Administra los productos farmacéuticos</p>
            </div>
            <a href="#" class="btn">+ Nuevo producto</a>
        </div>

        <table class="tabla">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Presentación</th>
                    <th>Precio (S/)</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.codigo}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.presentacion}"></td>
                    <td th:text="${p.precioUnitario}"></td>
                    <td><span class="estado" th:text="${p.estado}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="5">No hay productos registrados</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
