name: CI
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y probar
        run: mvn -B clean verify
      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: farmastock-jar
          path: target/*.jar