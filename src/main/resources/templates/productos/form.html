<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto - FarmaStock</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <aside th:replace="~{fragments/menu :: menu('productos')}"></aside>
    <main class="contenido">
        <h1 th:text="${producto.idProducto == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>
        <p class="subtitulo">Completa los datos del producto farmacéutico</p>
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="formulario">
            <input type="hidden" th:field="*{idProducto}">
            <input type="hidden" th:field="*{estado}">
            <label>Código</label>
            <input type="text" th:field="*{codigo}" required>
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required>
            <label>Presentación</label>
            <input type="text" th:field="*{presentacion}">
            <label>Precio unitario (S/)</label>
            <input type="number" step="0.01" min="0.01" th:field="*{precioUnitario}" required>
            <div class="acciones">
                <button type="submit" class="btn">Guardar</button>
                <a th:href="@{/productos}" class="btn-sec">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
